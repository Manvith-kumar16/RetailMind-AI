version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai_service
    networks:
      - retailmind_prod_network
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - ConnectionStrings__Redis=redis:6379
      - MLServiceUrl=http://ai_service:8001
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      - redis
    networks:
      - retailmind_prod_network
    restart: always

  ai_service:
    build:
      context: ./AI-Service
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-adminsdk.json
    volumes:
      - ./AI-Service/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    networks:
      - retailmind_prod_network
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - retailmind_prod_network
    restart: always

networks:
  retailmind_prod_network:
    driver: bridge

volumes:
  redis_prod_data:
