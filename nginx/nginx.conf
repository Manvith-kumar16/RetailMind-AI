worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    upstream dotnet_api {
        server api:8080;
    }

    upstream python_ml {
        server python_api:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # ── .NET Backend ───────────────────────────────────────────────────
        # Most .NET controllers already have [Route("api/[controller]")]
        # so we pass /api directly to the backend.
        location /api {
            proxy_pass         http://dotnet_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Python ML Service ──────────────────────────────────────────────
        # Routes /ml/predict-demand to python_api:8001/predict-demand
        location /ml/ {
            proxy_pass         http://python_ml/; # The trailing slash is important for path stripping
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Swagger UI (Dev Only) ──────────────────────────────────────────
        # Route the documentation through Nginx as well
        location /swagger {
            proxy_pass http://dotnet_api;
        }

        location /docs {
            proxy_pass http://python_ml/docs;
        }

        location /openapi.json {
            proxy_pass http://python_ml/openapi.json;
        }

        # ── Health Checks ───────────────────────────────────────────────────
        location /health {
            proxy_pass http://dotnet_api/health;
        }
    }
}
