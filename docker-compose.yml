version: "3.9"

networks:
  retailmind_net:
    driver: bridge

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: retailmind_postgres
    restart: unless-stopped
    networks:
      - retailmind_net
    environment:
      POSTGRES_DB:       RetailMindDB
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python ML API ─────────────────────────────────────────────────────────
  python_api:
    build:
      context: .
      dockerfile: python_api/Dockerfile
    container_name: retailmind_ml
    restart: unless-stopped
    networks:
      - retailmind_net
    # ports:
    #   - "8001:8001"          # exposed for local dev/testing; internal traffic uses Docker DNS
    volumes:
      - ./models:/app/models  # mount pre-trained .joblib files at runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis (Distributed Caching) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: retailmind_redis
    restart: unless-stopped
    networks:
      - retailmind_net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx (Reverse Proxy / API Gateway) ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: retailmind_nginx
    restart: unless-stopped
    networks:
      - retailmind_net
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      python_api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ── ASP.NET Core API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailmind_api
    restart: unless-stopped
    networks:
      - retailmind_net
    depends_on:
      postgres:
        condition: service_healthy
      python_api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=RetailMindDB;
        Username=postgres;Password=postgres_dev_password;
      ConnectionStrings__Redis: redis:6379
      JwtSettings__SecretKey: dev-only-secret-key-change-in-production-256bits
      JwtSettings__Issuer: RetailMind.API
      JwtSettings__Audience: RetailMind.Client
      # ── ML Service base URL (resolved via Docker internal DNS) ───────────
      MLServiceUrl: http://python_api:8001
    # ports:
    #   - "8080:8080" # hidden from external traffic; use Nginx entry point
    volumes:
      - api_logs:/app/Logs

volumes:
  postgres_data:
  api_logs:
  redis_data:
