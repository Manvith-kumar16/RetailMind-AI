version: '3.8'

services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai_service
    networks:
      - retailmind_network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=RetailMindDB;Username=postgres;Password=postgres_dev_password;
      - ConnectionStrings__Redis=redis:6379
      - MLServiceUrl=http://ai_service:8001
    depends_on:
      - db
      - redis
    networks:
      - retailmind_network

  ai_service:
    build:
      context: ./AI-Service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
    networks:
      - retailmind_network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_dev_password
      - POSTGRES_DB=RetailMindDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retailmind_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - retailmind_network

networks:
  retailmind_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
